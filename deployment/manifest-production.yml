applications:
  - name: cicct-softphone-admin-ui
    routes:
      - route: cicct-softphone-admin-ui.us-east-1.paas.lmig.com
    buildpack: nodejs_current
    instances: 2
    memory: 512M
    timeout: 180
    services:
      - newrelic
    env:
      NODE_ENV: production
      NEW_RELIC_APP_NAME: cicct-softphone-admin-ui
    blue-green:
      health-check-endpoint: /health
