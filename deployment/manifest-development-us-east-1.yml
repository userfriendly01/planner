applications:
- name: cicct-softphone-admin-ui-development
  routes:
    - route: cicct-softphone-admin-ui-development.us-east-1.np.paas.lmig.com
  buildpack: nodejs_current
  command: node createEnvFile.js && node server.js
  instances: 1
  memory: 2048M
  timeout: 600
  env:
    NODE_ENV: production
    APP_ENV: development
    DATADOG_APPLICATION_ID: ${secret.datadog.applicationId}
    DATADOG_CLIENT_TOKEN: ${secret.datadog.clientToken}
    AZURE_CLIENT_ID: ${secret.cicct-softphone-admin-ui.id}
    TROUX_ID: ${forge.troux_application_uuid}
    AZURE_REDIRECT_URI: https://triton-dev.lmig.com/triton-admin
    GRAPH_API_ID: tgufpgkyxvacrntvgb75iuo3pi
    GRAPH_CLIENT_ID: ${idp.cicct-softphone-admin-ui.resource.cct-shared-graph-api.development.appId}
    SOFTPHONE_SERVICE_URL: https://cicct-softphone-service-development.us-east-1.np.paas.lmig.com
    CALABRIO_SERVICE_URL: https://develop.cctapis.us-east-1.libertymutual.com/calabrio-service
    CALABRIO_SERVICE_CLIENT_ID: ${idp.cicct-softphone-admin-ui.resource.adcalser22-azure-api-development.development.appId}
    ADMIN_CLIENT_URL: https://6mtmnu5sge.execute-api.us-east-1.amazonaws.com/api
    ADMIN_CLIENT_ID: ${idp.cicct-softphone-admin-ui.resource.cct-shared-admin-service-api-development.development.appId}
  services:
    - everyday-curfew
  blue-green:
    health-check-endpoint: /health
