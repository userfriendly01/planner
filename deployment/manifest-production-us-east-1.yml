applications:
- name: cicct-softphone-admin-ui
  routes:
    - route: cicct-softphone-admin-ui.us-east-1.paas.lmig.com
  buildpack: nodejs_current
  command: node server.js
  instances: 2
  memory: 1024M
  timeout: 180
  env:
    NODE_ENV: production
    DATADOG_APPLICATION_ID: ${secret.datadog.applicationId}
    DATADOG_CLIENT_TOKEN: ${secret.datadog.clientToken}
    TROUX_ID: ${forge.troux_application_uuid}
    APP_ENV: production
  blue-green:
    health-check-endpoint: /health