applications:
- name: cicct-softphone-admin-ui
  routes:
    - route: cicct-softphone-admin-ui.us-east-1.paas.lmig.com
  buildpack: nodejs_current
  command: node createEnvFile.js && node server.js
  instances: 2
  memory: 2048M
  timeout: 180
  env:
    NODE_ENV: production
    APP_ENV: production
    DATADOG_APPLICATION_ID: ${secret.datadog.applicationId}
    DATADOG_CLIENT_TOKEN: ${secret.datadog.clientToken}
    AZURE_CLIENT_ID: ${secret.cicct-softphone-admin-ui.id}
    AZURE_REDIRECT_URI: https://triton.lmig.com/triton-admin
    TROUX_ID: ${forge.troux_application_uuid}
    GRAPH_API_URL: https://3k2iegyjmnfwxheh65ugy2vjt4.appsync-api.us-east-1.amazonaws.com/graphql
  blue-green:
    health-check-endpoint: /health
