applications:
- name: cicct-softphone-admin-ui-test
  routes:
    - route: cicct-softphone-admin-ui-test.us-east-1.np.paas.lmig.com
  buildpack: nodejs_current
  command: node server.js
  instances: 1
  memory: 1024M
  timeout: 180
  env:
    NODE_ENV: production
    DATADOG_APPLICATION_ID: ${bamboo.secret.datadog.applicationId}
    DATADOG_CLIENT_TOKEN: ${bamboo.secret.datadog.clientToken}
    TROUX_ID: ${bamboo.forge.troux_application_uuid}
    APP_ENV: test
  services:
    - everyday-curfew
  blue-green:
    health-check-endpoint: /health