applications:
- name: cicct-softphone-admin-ui-test
  routes:
    - route: cicct-softphone-admin-ui-test.us-east-1.np.paas.lmig.com
  buildpack: nodejs_current
  command: node createEnvFile.js && node server.js
  instances: 1
  memory: 2048M
  timeout: 180
  env:
    NODE_ENV: production
    APP_ENV: test
    DATADOG_APPLICATION_ID: ${secret.datadog.applicationId}
    DATADOG_CLIENT_TOKEN: ${secret.datadog.clientToken}
    AZURE_CLIENT_ID: ${secret.cicct-softphone-admin-ui.id}
    AZURE_REDIRECT_URI: https://triton-test.lmig.com/triton-admin
    TROUX_ID: ${forge.troux_application_uuid}
    GRAPH_API_ID: bz5ilxf2ercznouchavqvh26nm
    GRAPH_CLIENT_ID: ${idp.cicct-softphone-admin-ui.resource.cct-shared-graph-api.test.appId}
    SOFTPHONE_SERVICE_URL: https://cicct-softphone-service-test.us-east-1.np.paas.lmig.com
  services:
    - everyday-curfew
  blue-green:
    health-check-endpoint: /health
