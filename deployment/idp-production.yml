---
idp:
  - provider: azure
    applications:
      - name: cicct-softphone-admin-ui
        client: true
        email_address: AlohaTeam@libertymutual.com
        home_page_url: https://triton.lmig.com/triton-admin
        oidc: true
        platforms:
          - type: spa
            reply_urls:
              - https://triton.lmig.com/triton-admin/*
        rotate_secret_enabled: true
        user_roles:
          - name: Agent
            groups:
              - gci-cct-triton-prod-agent
          - name: Supervisor
            groups:
              - gci-cct-triton-prod-supv
          - name: Admin
            groups:
              - gci-cct-triton-prod-tritonadmin
          - name: FlowRead
            groups:
              - gpi-cct-config-flow-read
          - name: FlowReadWrite
            groups:
              - gpi-cct-config-flow-readwrite-prod
          - name: RouteRead
            groups:
              - gpi-cct-config-route-read
          - name: RouteReadWrite
            groups:
              - gpi-cct-config-route-readwrite-prod
